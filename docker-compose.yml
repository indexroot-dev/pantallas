# En la Raspberry Pi:  docker compose up -d --build
# Variables en .env: TUNNEL_TOKEN (túnel), ADMIN_PASSWORD (contraseña del usuario admin; por defecto indexroot)

# Logs acotados para no llenar el disco
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    build: .
    container_name: pantallas-app
    restart: unless-stopped
    mem_limit: 192m
    <<: *logs
    env_file:
      - path: .env
        required: false
    ports:
      # Abierto en la LAN para las pantallas de casa
      - "3200:3000"
    volumes:
      # Usuarios y códigos de grupo (data/usuarios.json); guardarlo fuera de la Pi de vez en cuando
      - ./data:/app/data

  # Publica la app (pantallas.allsx.me → http://app:3000) por Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pantallas-tunel
    restart: unless-stopped
    mem_limit: 128m
    <<: *logs
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
